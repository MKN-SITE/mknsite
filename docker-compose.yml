services:
  init:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: mknsite-dev
    working_dir: /app/apps/api
    command: ["sh", "-c", "until bun run db:migrate; do echo 'Menunggu MySQL siap menerima koneksi...'; sleep 3; done; bun run db:seed"]
    environment:
      DATABASE_URL: mysql://mknsite:mknsite-local-only@mysql:3306/mknsite
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme-dev-admin}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-changeme-dev-superadmin}
      SEED_HR_PASSWORD: ${SEED_HR_PASSWORD:-changeme-dev-hr}
    volumes:
      - ./apps/api/drizzle:/app/apps/api/drizzle:ro
      - ./apps/api/src:/app/apps/api/src:ro
      - ./form-templates:/app/form-templates:ro
    depends_on:
      mysql:
        condition: service_healthy

  api:
    image: mknsite-dev
    pull_policy: never
    working_dir: /app/apps/api
    command: ["bun", "src/index.ts"]
    environment:
      NODE_ENV: development
      PORT: "3001"
      APP_ORIGIN: http://localhost:3100
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-mknsite-local-dev-secret-key-32ch}
      DATABASE_URL: mysql://mknsite:mknsite-local-only@mysql:3306/mknsite
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./apps/api/uploads:/app/apps/api/uploads
      - ./apps/api/src:/app/apps/api/src:ro
      - ./apps/api/drizzle:/app/apps/api/drizzle:ro
      - ./apps/api/test:/app/apps/api/test:ro
      - ./storage:/app/storage
      - ./form-templates:/app/form-templates:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3001/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: mknsite-dev
    pull_policy: never
    working_dir: /app/apps/web
    command: ["bun", "--bun", "next", "dev", "--webpack", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      INTERNAL_API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: /api-backend
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "3100:3000"
    volumes:
      # Share frontend source while keeping container dependencies and build cache isolated.
      - ./apps/web/app:/app/apps/web/app:ro
      - ./apps/web/components:/app/apps/web/components:ro
      - ./apps/web/features:/app/apps/web/features:ro
      - ./apps/web/lib:/app/apps/web/lib:ro
      - ./apps/web/next.config.ts:/app/apps/web/next.config.ts:ro
      - ./apps/web/public:/app/apps/web/public:ro
      - ./apps/web/styles:/app/apps/web/styles:ro
    depends_on:
      api:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mknsite
      MYSQL_USER: mknsite
      MYSQL_PASSWORD: mknsite-local-only
      MYSQL_ROOT_PASSWORD: root-local-only
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mknsite_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mknsite_mysql:
